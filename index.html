<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Google Sheets WebMCP — 100% Client-Side Spreadsheet</title>
  
  <!-- Tailwind CSS via CDN for instant GitHub Pages styling -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- HTMX for declarative hypermedia workflows -->
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>

  <!-- Google Fonts: Roboto & Roboto Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,400&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="./src/style.css" />
</head>
<body class="h-screen w-screen flex flex-col bg-white overflow-hidden select-none text-gray-800">

  <!-- 1. Top Ribbon Menu Bar -->
  <header id="menu-bar-container" class="flex-shrink-0 z-30"></header>

  <!-- 2. Formatting & Actions Toolbar -->
  <section id="toolbar-container" class="flex-shrink-0 z-20"></section>

  <!-- 3. Formula Bar -->
  <section id="formula-bar-container" class="flex-shrink-0 z-10"></section>

  <!-- 4. Main Spreadsheet Grid (Virtualized/Scrollable) -->
  <main id="grid-container" class="flex-1 overflow-auto relative bg-gray-100"></main>

  <!-- 5. Bottom Sheets Tabs & Status Bar -->
  <footer id="sheet-tabs-container" class="flex-shrink-0 z-20"></footer>

  <!-- 6. WebMCP AI Agent Sidecar Drawer -->
  <aside id="agent-drawer-container" class="fixed top-0 right-0 bottom-0 z-50 transform translate-x-full drawer-transition"></aside>

  <!-- 7. Dynamic Modal Container for HTMX Swaps -->
  <div id="modal-container"></div>

  <!-- 8. Declarative WebMCP Forms (Autonomous Agent Discovery Surface) -->
  <div id="declarative-webmcp-surface" class="sr-only">
    <!-- 1. sheets_set_cell -->
    <form toolname="sheets_set_cell" tooldescription="Set raw value or formula for a cell in the active or named worksheet" tooloutputschema='{"type":"object","properties":{"success":{"type":"boolean"},"cell":{"type":"string"},"value":{"type":["string","number","boolean","null"]}},"required":["success","cell"],"additionalProperties":false}'>
      <input type="text" name="cell" required pattern="^([A-Za-z0-9_]+!)?[A-Za-z]+[1-9][0-9]*$" placeholder="A1" toolparamdescription="Cell coordinate in standard A1 notation (e.g. A1, C10)" />
      <input type="text" name="value" required placeholder="=A1*2" toolparamdescription="String literal, numeric value, or formula starting with '=' (e.g. '=SUM(A1:A10)')" />
      <input type="text" name="sheet" placeholder="Sheet1" toolparamdescription="Optional worksheet tab name (defaults to active sheet)" />
      <button type="submit">Set Cell</button>
    </form>

    <!-- 2. sheets_get_cell -->
    <form toolname="sheets_get_cell" tooldescription="Get raw value, computed value and format of a specific cell" tooloutputschema='{"type":"object","properties":{"cell":{"type":"string"},"sheet":{"type":"string"},"raw":{"type":"string"},"value":{"type":["string","number","boolean","null"]},"error":{"type":["string","null"]},"format":{"type":"object","properties":{"bold":{"type":"boolean"},"italic":{"type":"boolean"},"textColor":{"type":"string"},"bgColor":{"type":"string"},"align":{"type":"string","enum":["left","center","right"]},"numberFormat":{"type":"string","enum":["text","number","currency","percent"]}},"additionalProperties":false}},"required":["cell","sheet","raw","value"],"additionalProperties":false}'>
      <input type="text" name="cell" required pattern="^([A-Za-z0-9_]+!)?[A-Za-z]+[1-9][0-9]*$" placeholder="A1" toolparamdescription="Cell coordinate reference in standard A1 notation, e.g. A1 or Sheet1!B2" />
      <input type="text" name="sheet" placeholder="Sheet1" toolparamdescription="Optional sheet tab name (defaults to active sheet)" />
      <button type="submit">Get Cell</button>
    </form>

    <!-- 3. sheets_get_range -->
    <form toolname="sheets_get_range" tooldescription="Get values and formulas for a rectangular range of cells" tooloutputschema='{"type":"object","properties":{"range":{"type":"string"},"sheet":{"type":"string"},"matrix":{"type":"array","items":{"type":"array","items":{"type":"object","properties":{"ref":{"type":"string"},"raw":{"type":"string"},"value":{"type":["string","number","boolean","null"]}},"required":["ref","raw","value"],"additionalProperties":false}}}},"required":["range","sheet","matrix"],"additionalProperties":false}'>
      <input type="text" name="range" required pattern="^([A-Za-z0-9_]+!)?[A-Za-z]+[1-9][0-9]*:[A-Za-z]+[1-9][0-9]*$" placeholder="A1:B5" toolparamdescription="Rectangular 2D range reference in A1:B10 format" />
      <input type="text" name="sheet" placeholder="Sheet1" toolparamdescription="Optional worksheet tab name" />
      <button type="submit">Get Range</button>
    </form>

    <!-- 4. sheets_set_range -->
    <form toolname="sheets_set_range" tooldescription="Batch set a 2D matrix of values or formulas starting at a top-left cell" tooloutputschema='{"type":"object","properties":{"success":{"type":"boolean"},"rowsUpdated":{"type":"number"}},"required":["success","rowsUpdated"],"additionalProperties":false}'>
      <input type="text" name="startCell" required pattern="^([A-Za-z0-9_]+!)?[A-Za-z]+[1-9][0-9]*$" placeholder="A1" toolparamdescription="Top-left starting cell coordinate, e.g. A1" />
      <textarea name="values" required placeholder="[['Header1', 'Header2'], ['10', '20']]" toolparamdescription="JSON-encoded 2D array of strings representing table rows and columns"></textarea>
      <input type="text" name="sheet" placeholder="Sheet1" toolparamdescription="Optional sheet tab name" />
      <button type="submit">Set Range</button>
    </form>

    <!-- 5. sheets_evaluate_formula -->
    <form toolname="sheets_evaluate_formula" tooldescription="Evaluate an arbitrary formula expression on the fly without writing to any cell" tooloutputschema='{"type":"object","properties":{"formula":{"type":"string"},"result":{"type":["string","number","boolean","null"]},"error":{"type":["string","null"]}},"required":["formula"],"additionalProperties":false}'>
      <input type="text" name="formula" required pattern="^=.*$" placeholder="=SUM(10, 20, 30)" toolparamdescription="Spreadsheet formula starting with '=' (e.g. '=SUM(10, 20, 30)')" />
      <input type="text" name="sheet" placeholder="Sheet1" toolparamdescription="Optional worksheet evaluation context" />
      <button type="submit">Evaluate</button>
    </form>

    <!-- 6. sheets_clear_range -->
    <form toolname="sheets_clear_range" tooldescription="Clear values and formatting in a specified rectangular range" tooloutputschema='{"type":"object","properties":{"success":{"type":"boolean"},"clearedRange":{"type":"string"}},"required":["success","clearedRange"],"additionalProperties":false}'>
      <input type="text" name="range" required pattern="^([A-Za-z0-9_]+!)?[A-Za-z]+[1-9][0-9]*:[A-Za-z]+[1-9][0-9]*$" placeholder="A1:C10" toolparamdescription="Range reference to wipe in A1:B10 format" />
      <input type="text" name="sheet" placeholder="Sheet1" toolparamdescription="Optional sheet tab name" />
      <button type="submit">Clear Range</button>
    </form>

    <!-- 7. sheets_create_sheet -->
    <form toolname="sheets_create_sheet" tooldescription="Add a new sheet tab to the workbook with the given name" tooloutputschema='{"type":"object","properties":{"success":{"type":"boolean"},"sheetId":{"type":"string"},"name":{"type":"string"}},"required":["success","sheetId","name"],"additionalProperties":false}'>
      <input type="text" name="name" required placeholder="Q4_Forecast" toolparamdescription="Unique name for the new worksheet tab" />
      <button type="submit">Create Sheet</button>
    </form>

    <!-- 8. sheets_delete_sheet -->
    <form toolname="sheets_delete_sheet" tooldescription="Delete a sheet tab from the workbook by name" tooloutputschema='{"type":"object","properties":{"success":{"type":"boolean"},"deleted":{"type":"string"}},"required":["success","deleted"],"additionalProperties":false}'>
      <input type="text" name="name" required placeholder="TempSheet" toolparamdescription="Name of the sheet tab to delete" />
      <button type="submit">Delete Sheet</button>
    </form>

    <!-- 9. sheets_list_sheets -->
    <form toolname="sheets_list_sheets" tooldescription="List all sheets in the current workbook and report the active sheet" tooloutputschema='{"type":"object","properties":{"activeSheet":{"type":"string"},"sheets":{"type":"array","items":{"type":"object","properties":{"id":{"type":"string"},"name":{"type":"string"},"cellCount":{"type":"number"}},"required":["id","name","cellCount"],"additionalProperties":false}}},"required":["activeSheet","sheets"],"additionalProperties":false}'>
      <button type="submit">List Sheets</button>
    </form>

    <!-- 10. sheets_find_replace -->
    <form toolname="sheets_find_replace" tooldescription="Find and replace text or formula substrings across cells" tooloutputschema='{"type":"object","properties":{"success":{"type":"boolean"},"replacementsCount":{"type":"number"}},"required":["success","replacementsCount"],"additionalProperties":false}'>
      <input type="text" name="find" required placeholder="OldText" toolparamdescription="String or substring to search for" />
      <input type="text" name="replace" required placeholder="NewText" toolparamdescription="Replacement string to substitute" />
      <input type="text" name="sheet" placeholder="Sheet1" toolparamdescription="Optional sheet tab name" />
      <button type="submit">Find and Replace</button>
    </form>

    <!-- 11. sheets_export_data -->
    <form toolname="sheets_export_data" tooldescription="Export spreadsheet data in CSV or JSON format" tooloutputschema='{"type":"object","properties":{"format":{"type":"string"},"data":{"type":"string"}},"required":["format","data"],"additionalProperties":false}'>
      <select name="format" required toolparamdescription="Export serialization format">
        <option value="csv">csv</option>
        <option value="json">json</option>
      </select>
      <input type="text" name="sheet" placeholder="Sheet1" toolparamdescription="Optional sheet tab name for CSV export" />
      <button type="submit">Export Data</button>
    </form>

    <!-- 12. sheets_get_summary -->
    <form toolname="sheets_get_summary" tooldescription="Get an analytical summary of non-empty cells, columns, and numeric totals" tooloutputschema='{"type":"object","properties":{"title":{"type":"string"},"sheet":{"type":"string"},"populatedCells":{"type":"number"},"numericCellsCount":{"type":"number"},"sumOfNumericCells":{"type":"number"},"averageOfNumericCells":{"type":"number"}},"required":["title","sheet","populatedCells","numericCellsCount","sumOfNumericCells","averageOfNumericCells"],"additionalProperties":false}'>
      <input type="text" name="sheet" placeholder="Sheet1" toolparamdescription="Optional worksheet tab name" />
      <button type="submit">Get Summary</button>
    </form>
  </div>

  <!-- Main Application Bootstrap -->
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
